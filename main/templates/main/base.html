<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}آکادمی سید{% endblock %}</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap");

      :root {
        --primary: #4f46e5;
        --secondary: #7c3aed;
        --bg: #f3f6ff;
        --text: #111827;
        --muted: #4b5563;
        --line: #e5e7eb;
        --card: #ffffff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Vazirmatn", Tahoma, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      .container {
        width: min(1200px, 92%);
        margin: 0 auto;
      }

      .btn {
        display: inline-block;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 700;
        cursor: pointer;
        border: none;
        transition: 0.2s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        box-shadow: 0 14px 25px rgba(79, 70, 229, 0.2);
      }

      .btn-light {
        background: white;
        color: var(--primary);
        border: 1px solid var(--line);
      }

      .nav {
        min-height: 78px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 800;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 24px;
        color: var(--muted);
        font-weight: 600;
      }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}
  </body>
</html>
