<header style="position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.92); border-bottom: 1px solid #e5e7eb; backdrop-filter: blur(10px);">
  <div class="container nav">
    <div class="brand">
      <div class="brand-mark">🎓</div>
      <span>آکادمی سید</span>
    </div>

    <div style="display:flex; align-items:center; gap:12px;">
      <div style="display:flex; align-items:center; gap:10px; border:1px solid #e5e7eb; border-radius:14px; padding:8px 12px; background:#f8fafc;">
        <div style="width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(135deg,#e0e7ff,#ddd6fe); font-weight:800; color:#4f46e5;">
          {% if user.first_name %}
            {{ user.first_name|first|upper }}
          {% else %}
            {{ user.username|first|upper }}
          {% endif %}
        </div>
        <strong>
          {% if user.get_full_name %}
            {{ user.get_full_name }}
          {% else %}
            {{ user.username }}
          {% endif %}
        </strong>
      </div>

      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary">خروج</button>
      </form>
    </div>
  </div>
</header>
